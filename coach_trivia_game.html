<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vail Composite Coach Trivia Match</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.1em;
            opacity: 0.95;
            margin-bottom: 15px;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .header-text {
            flex: 1;
            min-width: 250px;
        }

        #qrcode {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        #qrcode img {
            display: block;
        }

        .qr-instruction {
            background: rgba(255,255,255,0.2);
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 0.95em;
            margin-top: 15px;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .qr-instruction strong {
            display: block;
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }
            
            .header-content {
                gap: 15px;
            }

            #qrcode {
                padding: 10px;
            }
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .game-board {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .player-name-input {
            display: flex;
            gap: 10px;
        }

        .player-name-input input {
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            flex: 1;
            max-width: 200px;
        }

        .player-name-input button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .player-name-input button:hover {
            background: #764ba2;
        }

        .score-display {
            text-align: center;
        }

        .score-display .label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .score-display .score {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .card {
            aspect-ratio: 3/4;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 600;
            color: #333;
            user-select: none;
            transition: all 0.2s ease;
            font-size: 0.9em;
            line-height: 1.3;
            overflow-y: auto;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .card.coach-name {
            background: linear-gradient(135deg, #9fa8f7 0%, #b392d8 100%);
            color: white;
            border-color: #9fa8f7;
            font-size: 1.05em;
        }

        .card.profile {
            background: linear-gradient(135deg, #81c784 0%, #76b876 100%);
            color: black;
            border-color: #81c784;
            font-size: 0.8em;
            line-height: 1.5;
            padding: 12px;
            align-items: flex-start;
            padding-top: 15px;
        }

        .card.profile strong {
            font-size: 1.1em;
            display: block;
            margin-bottom: 10px;
        }

        .card.matched {
            opacity: 0.5;
            cursor: not-allowed;
            border: 3px solid #4caf50;
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
        }

        .card.selected {
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.5);
            transform: scale(1.05);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #764ba2;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #da190b;
        }

        .leaderboard {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            height: fit-content;
        }

        .leaderboard-title {
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }

        .leaderboard-list {
            list-style: none;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.95em;
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .leaderboard-item .rank {
            font-weight: bold;
            color: #667eea;
            min-width: 30px;
        }

        .leaderboard-item .name {
            flex: 1;
            margin-left: 10px;
            color: #333;
        }

        .leaderboard-item .points {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
        }

        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        .message.success {
            background: #c8e6c9;
            color: #2e7d32;
            border: 1px solid #81c784;
        }

        .message.info {
            background: #bbdefb;
            color: #1565c0;
            border: 1px solid #64b5f6;
        }

        .match-count {
            text-align: center;
            font-size: 1.1em;
            color: #666;
            margin-bottom: 10px;
        }

        .empty-leaderboard {
            text-align: center;
            color: #999;
            padding: 20px 0;
            font-size: 0.9em;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 20px;
        }

        .reset-btn:hover {
            background: #da190b;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div class="header-text">
                    <h1>🚴 Coach Trivia Match</h1>
                    <p class="subtitle">Vail Composite Mountain Bike Team</p>
                    <div class="qr-instruction">
                        <strong>📱 Scan to join the game!</strong>
                        Enter your name and match coaches to their profiles
                    </div>
                </div>
                <div id="qrcode"></div>
            </div>
        </header>

        <div class="main-content">
            <div class="game-board">
                <div class="board-header">
                    <div class="player-name-input">
                        <input type="text" id="playerName" placeholder="Enter your name" maxlength="30">
                        <button onclick="setPlayerName()">Join</button>
                    </div>
                    <div class="score-display">
                        <div class="label">Your Score</div>
                        <div class="score" id="playerScore">0</div>
                    </div>
                </div>

                <div id="message-container"></div>

                <div class="match-count" id="matchCount"></div>

                <div class="cards-container" id="cardsContainer"></div>

                <div class="action-buttons">
                    <button class="btn btn-primary" onclick="resetGame()">New Game</button>
                </div>
            </div>

            <div class="leaderboard">
                <div class="leaderboard-title">Leaderboard</div>
                <ul class="leaderboard-list" id="leaderboardList">
                    <li class="empty-leaderboard">No players yet</li>
                </ul>
                <button class="reset-btn" onclick="clearLeaderboard()">Clear Scores</button>
            </div>
        </div>
    </div>

    <script>
        // Coach data
        const coaches = [
            { id: 1, name: 'Sarah Lester', trail: 'Vail Trails', color: 'Green', snack: 'Peanut butter bagel', hobby: 'Gardening', brand: 'Trail Manos Gloves' },
            { id: 2, name: 'Shelby Wraith', trail: 'Flagstaff Race Course', color: 'Navy Blue', snack: 'Go-go Squeeze Applesauce', hobby: 'Reading', brand: 'Tasco Bike Gear' },
            { id: 3, name: 'Kenny Davis', trail: 'Snowflake', color: 'Green', snack: 'Crunchy PB folded with Bread', hobby: 'Camping', brand: 'Yeti Bikes and Primal Gear' },
            { id: 4, name: 'Randy Black', trail: 'Ft. Tuthill', color: 'Black', snack: 'Granola Bars or Bananas', hobby: 'Hiking', brand: 'Outbound' },
            { id: 5, name: 'Luis Velo', trail: 'Fort Tuthill', color: 'Gray', snack: 'Snack bar or Clif Bar', hobby: 'Cooking', brand: 'Scott and SRAM' },
            { id: 6, name: 'Scott Wraith', trail: 'Flagstaff', color: 'Black', snack: 'Bananas', hobby: 'Hunting', brand: 'Santa Cruz' },
            { id: 7, name: 'Charlie Davis', trail: 'Flagstaff Race Course and Vail Trails', color: 'White with Blue Accents', snack: 'Fried eggs and Rice Krispie Bars', hobby: 'Exploring/Hiking', brand: 'Specialized Bikes and Assos Gear because I\'m bougie' },
            { id: 8, name: 'Dawn Peed', trail: 'Flagstaff', color: 'Chameleon blue', snack: 'Protein shake', hobby: 'Reading and Gardening', brand: 'POC Helmets' },
            { id: 9, name: 'Eric Preiss', trail: 'McDowell', color: 'Multi-color paint fleck', snack: 'Fig bars', hobby: 'Hiking/Backpacking', brand: 'Scott Bikes' },
            { id: 10, name: 'Joshua Reed', trail: 'Flagstaff', color: 'Red', snack: 'Costco Fig Bars', hobby: 'Playing Guitar', brand: 'Trek Bikes' },
            { id: 11, name: 'John Leach', trail: 'Ft. Tuthill and Fantasy Island South', color: 'Bare Metal', snack: 'Dates', hobby: 'Pottery', brand: 'Specialized' },
            { id: 12, name: 'Melissa Lefebvre', trail: 'McDowell', color: 'Purple', snack: 'Fruit Bar or Rice Krispie Treat', hobby: 'Trail running', brand: 'Liv and Shredly' }
        ];

        let currentPlayer = '';
        let playerMatches = new Set();
        let selectedCards = [];
        let leaderboard = JSON.parse(localStorage.getItem('coachTrivia_leaderboard')) || [];

        function initializeGame() {
            renderCards();
            updateLeaderboard();
        }

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';

            // Create name cards and profile cards
            const allCards = [];
            coaches.forEach(coach => {
                // Coach name card
                allCards.push({ 
                    type: 'name', 
                    coachId: coach.id, 
                    content: coach.name 
                });
                // Full profile card
                allCards.push({ 
                    type: 'profile', 
                    coachId: coach.id, 
                    content: `Fav. Race/Trail: ${coach.trail}<br>
                    Preferred Bike Color: ${coach.color}<br>
                    Pre-ride Snack: ${coach.snack}<br>
                    Extra Hobby: ${coach.hobby}<br>
                    Fav. Brand: ${coach.brand}`
                });
            });

            // Shuffle cards
            allCards.sort(() => Math.random() - 0.5);

            allCards.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                if (card.type === 'name') {
                    cardEl.classList.add('coach-name');
                } else {
                    cardEl.classList.add('profile');
                }

                if (playerMatches.has(`${card.coachId}-${card.type}`)) {
                    cardEl.classList.add('matched');
                }

                cardEl.innerHTML = card.content;
                cardEl.dataset.coachId = card.coachId;
                cardEl.dataset.type = card.type;

                cardEl.addEventListener('click', () => selectCard(cardEl, card));
                container.appendChild(cardEl);
            });

            updateMatchCount();
        }

        function selectCard(cardEl, card) {
            if (cardEl.classList.contains('matched')) return;
            if (!currentPlayer) {
                showMessage('Please enter your name first!', 'info');
                return;
            }

            // Deselect if clicking same card
            if (cardEl.classList.contains('selected')) {
                cardEl.classList.remove('selected');
                selectedCards = selectedCards.filter(c => c.element !== cardEl);
                return;
            }

            // Only allow 2 selections
            if (selectedCards.length >= 2) return;

            cardEl.classList.add('selected');
            selectedCards.push({ element: cardEl, card: card });

            if (selectedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            const [first, second] = selectedCards;

            // Check if they're from same coach
            if (first.card.coachId === second.card.coachId) {
                // Valid match!
                first.element.classList.add('matched');
                second.element.classList.add('matched');
                first.element.classList.remove('selected');
                second.element.classList.remove('selected');

                playerMatches.add(`${first.card.coachId}-${first.card.type}`);
                playerMatches.add(`${second.card.coachId}-${second.card.type}`);

                // Add points
                addPlayerScore(10);
                showMessage('✓ Match found!', 'success');

                // Check if game is won
                if (playerMatches.size === coaches.length) {
                    showMessage('🎉 You matched all coaches!', 'success');
                }
            } else {
                // No match
                showMessage('✗ Not a match', 'info');
            }

            selectedCards = [];
            setTimeout(() => {
                first.element.classList.remove('selected');
                second.element.classList.remove('selected');
            }, 500);

            updateMatchCount();
        }

        function addPlayerScore(points) {
            if (!currentPlayer) return;
            const scoreEl = document.getElementById('playerScore');
            const currentScore = parseInt(scoreEl.textContent) || 0;
            const newScore = currentScore + points;
            scoreEl.textContent = newScore;

            // Update leaderboard
            updatePlayerInLeaderboard(currentPlayer, newScore);
        }

        function updatePlayerInLeaderboard(name, score) {
            const existing = leaderboard.find(p => p.name === name);
            if (existing) {
                existing.score = Math.max(existing.score, score);
            } else {
                leaderboard.push({ name, score });
            }
            leaderboard.sort((a, b) => b.score - a.score);
            localStorage.setItem('coachTrivia_leaderboard', JSON.stringify(leaderboard));
            updateLeaderboard();
        }

        function updateLeaderboard() {
            const list = document.getElementById('leaderboardList');
            if (leaderboard.length === 0) {
                list.innerHTML = '<li class="empty-leaderboard">No players yet</li>';
                return;
            }

            list.innerHTML = leaderboard.map((player, idx) => `
                <li class="leaderboard-item">
                    <span class="rank">#${idx + 1}</span>
                    <span class="name">${player.name}</span>
                    <span class="points">${player.score}</span>
                </li>
            `).join('');
        }

        function updateMatchCount() {
            const total = coaches.length;
            const matched = playerMatches.size;
            document.getElementById('matchCount').textContent = `Matched: ${matched} / ${total} coaches`;
        }

        function setPlayerName() {
            const input = document.getElementById('playerName');
            const name = input.value.trim();
            if (!name) {
                showMessage('Please enter your name', 'info');
                return;
            }
            currentPlayer = name;
            input.disabled = true;
            input.style.opacity = '0.6';
            document.querySelector('.player-name-input button').disabled = true;
            document.querySelector('.player-name-input button').style.opacity = '0.6';
            showMessage(`Welcome, ${name}! Start matching...`, 'success');

            // Set score from leaderboard if player exists
            const existingPlayer = leaderboard.find(p => p.name === name);
            if (existingPlayer) {
                document.getElementById('playerScore').textContent = existingPlayer.score;
            }
        }

        function resetGame() {
            if (!currentPlayer) {
                showMessage('Please enter your name first', 'info');
                return;
            }
            playerMatches.clear();
            selectedCards = [];
            document.getElementById('playerScore').textContent = '0';
            renderCards();
            showMessage('Game reset!', 'info');
        }

        function clearLeaderboard() {
            if (confirm('Are you sure you want to clear all scores?')) {
                leaderboard = [];
                localStorage.removeItem('coachTrivia_leaderboard');
                updateLeaderboard();
                showMessage('Leaderboard cleared', 'info');
            }
        }

        function showMessage(text, type) {
            const container = document.getElementById('message-container');
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            container.innerHTML = '';
            container.appendChild(msg);
            setTimeout(() => container.innerHTML = '', 3000);
        }

        // Initialize on load
        window.addEventListener('load', function() {
            initializeGame();
            // Generate QR code pointing to the GitHub raw URL
            const qrUrl = "https://raw.githubusercontent.com/melissallefebvre-crypto/VailMTB/refs/heads/main/coach_trivia_game.html";
            new QRCode(document.getElementById("qrcode"), {
                text: qrUrl,
                width: 180,
                height: 180,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        });
    </script>
</body>
</html>
